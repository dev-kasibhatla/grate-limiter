[package]
name = "grate-limiter-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
grate-limiter = { path = "../../crates/grate-limiter" }
serde_json = "1"
arbitrary = { version = "1", features = ["derive"] }

[[bin]]
name = "fuzz_config"
path = "fuzz_targets/fuzz_config.rs"
test = false
doc = false

[[bin]]
name = "fuzz_engine"
path = "fuzz_targets/fuzz_engine.rs"
test = false
doc = false

[workspace]
